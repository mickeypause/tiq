name: Draft release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run verify:package
      - name: Create verified draft with release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(bun -p "'v' + require('./packages/rn-qa-overlay/package.json').version")"
          shasum -a 256 artifacts/npm/*.tgz > artifacts/npm/SHA256SUMS
          gh release create "$TAG" artifacts/npm/*.tgz artifacts/npm/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --draft --generate-notes
