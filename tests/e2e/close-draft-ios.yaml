# Requires example Linear sign-in; imports stock Simulator photos and submits no issues.
{
  "steps": [
    {
      "launch": "dev.rnqaoverlay.example"
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "identifier": "qa-overlay.button"
        },
        "timeoutMs": 15000
      }
    },
    {
      "await": {
        "idle": true
      }
    },
    {
      "tap": {
        "text": "Report bug"
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "identifier": "qa-overlay.title"
        },
        "timeoutMs": 15000
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "hidden",
        "selector": {
          "identifier": "qa-overlay.button"
        }
      }
    },
    {
      "await": {
        "idle": true
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "text": "Typing Predictions"
        }
      }
    },
    {
      "tap": {
        "id": "qa-overlay.close"
